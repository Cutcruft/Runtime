name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: runtime/frontend/package-lock.json

      - name: Build (frontend + SDK + plugins + core JAR)
        run: make build

      - name: Run unit tests
        run: mvn test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            runtime/target/runtime-*.jar
            tmp/plugins/demo/demo.jar
            tmp/plugins/demo/config.yaml
            tmp/plugins/demo-storage/demo-storage.jar
            tmp/plugins/demo-storage/config.yaml
