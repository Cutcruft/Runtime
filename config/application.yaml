server:
  host: 0.0.0.0
  port: 8080

plugins:
  directories:
    - plugins
    - .plugins

storage:
  backend: files
  enabled: true
  maxEntities: -1
  eviction: lru
  files:
    directory: .data/projects

ui:
  theme:
    mode: auto
    palette:
      light:
        bg: "#f5f6f8"
        surface: "#ffffff"
        text: "#1c1c1c"
        muted: "#666666"
        border: "#e2e2e2"
        primary: "#0066cc"
        primaryHover: "#0052a3"
        danger: "#b00020"
        success: "#1b7f3b"
        warning: "#b26a00"
        info: "#0066cc"
      dark:
        bg: "#16181d"
        surface: "#1f2329"
        text: "#e8e8e8"
        muted: "#9aa0a6"
        border: "#343a42"
        primary: "#4d9fff"
        primaryHover: "#6fb1ff"
        danger: "#ff6b6b"
        success: "#4cd07d"
        warning: "#ffc24d"
        info: "#4d9fff"
    typography:
      fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      headingFont: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      monospaceFont: "'SF Mono', Menlo, monospace"
      baseSize: "14px"
      scale:
        sm: "12px"
        md: "14px"
        lg: "16px"
        xl: "20px"
    radii:
      sm: "6px"
      md: "8px"
      lg: "12px"
      xl: "16px"
    spacing:
      xs: "4px"
      sm: "8px"
      md: "12px"
      lg: "20px"
      xl: "32px"
    motion:
      duration:
        fast: "120ms"
        normal: "240ms"
        slow: "400ms"
      easing:
        default: "cubic-bezier(0.2, 0.8, 0.2, 1)"
        in: "cubic-bezier(0.4, 0, 1, 1)"
        out: "cubic-bezier(0, 0, 0.2, 1)"

dev:
  enabled: true
  watchIntervalMs: 1000

collaboration:
  enabled: true
  cursorsEnabled: false
