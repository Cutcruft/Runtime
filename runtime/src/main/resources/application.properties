# Quarkus configuration for CutCruft Runtime
# Runtime config (server port, storage, etc.) lives in runtime.yaml — Quarkus reads this file.

# HTTP server
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# Logging
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# Native image resource includes
quarkus.native.resources.includes=runtime.yaml,plugins/**,messages/**,static/**,config/**,yaml/**

