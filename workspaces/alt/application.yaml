server:
  host: 0.0.0.0
  port: 8080

plugins:
  directories:
    - workspaces/alt/plugins

storage:
  backend: files
  enabled: true
  maxEntities: -1
  eviction: lru
  files:
    directory: .data/projects-alt

ui:
  app:
    title: Alt Workspace
    logo: null
    layout: sidebar
  theme:
    mode: dark

i18n:
  defaultLocale: en
  locales:
    - en
    - ru

dev:
  enabled: false
  watchIntervalMs: 1000

collaboration:
  enabled: true
  cursorsEnabled: false
